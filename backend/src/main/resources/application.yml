server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: devnest-labs-api
  jackson:
    serialization:
      indent-output: true
  datasource:
    # SQLite local DB for development; ready to swap with MySQL/PostgreSQL in production
    url: ${DB_URL:jdbc:sqlite:devnest.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
    hibernate:
      ddl-auto: update
    show-sql: false

devnest:
  jwt:
    secret: ${JWT_SECRET:devnest-labs-stateless-jwt-secret-key-2026-production-sqlite-mysql}
  gemini:
    # Supports GEMINI_API_KEY, GOOGLE_API_KEY, or provided default key
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:AIzaSyCDNBTMaSD_mEPyooi-d55HOPGpxUtnRpw}}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-seconds: 45
    max-tokens: 2500
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
      - "https://devnestlabs.shop"
  limits:
    max-code-chars: 12000
    max-error-chars: 6000
