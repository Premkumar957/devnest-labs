server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: devnest-labs-api
  jackson:
    serialization:
      indent-output: true

devnest:
  claude:
    # Supports both ANTHROPIC_API_KEY and CLAUDE_API_KEY
    api-key: ${ANTHROPIC_API_KEY:${CLAUDE_API_KEY:}}
    model: ${CLAUDE_MODEL:claude-3-5-sonnet-20241022}
    api-url: https://api.anthropic.com/v1/messages
    timeout-seconds: 45
    max-tokens: 2500
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
      - "https://devnestlabs.shop"
  limits:
    max-code-chars: 12000
    max-error-chars: 6000
